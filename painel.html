<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Solicitações</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="painel-wrap">

  <div class="painel-header">
    <div>
      <div style="font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-label);font-weight:600;">Atendimento ao eleitor</div>
      <h1 style="font-size:28px;font-weight:800;margin-top:4px;">Painel de Solicitações</h1>
      <div style="font-size:14px;color:var(--c-text-muted);margin-top:6px;">
        Olá, <span id="nome-usuario">—</span> ·
        <button class="btn-text no-print" id="btn-sair" style="padding:0;font-size:14px;text-decoration:underline;">Sair</button>
      </div>
    </div>
    <div class="no-print" style="display:flex;gap:12px;flex-wrap:wrap;">
      <a href="coleta.html" class="btn" style="width:auto;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Nova Solicitação
      </a>
      <button class="btn btn-secondary" id="btn-exportar" style="width:auto;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 10l5 5 5-5"></path><path d="M20 21H4"></path></svg>
        Exportar PDF
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Total de solicitações</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Atendidas</div>
      <div class="value" id="stat-atendidas">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Bairro com mais pedidos</div>
      <div class="value" id="stat-bairro">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Tipo mais pedido</div>
      <div class="value" id="stat-tipo">—</div>
    </div>
  </div>

  <div class="filtros no-print">
    <select id="filtro-bairro"><option value="">Bairro: Todos</option></select>
    <select id="filtro-tipo"><option value="">Tipo: Todos</option></select>
    <select id="filtro-coletor"><option value="">Coletado por: Todos</option></select>
    <select id="filtro-status">
      <option value="">Status: Todos</option>
      <option value="pendente">Pendente</option>
      <option value="atendida">Atendida</option>
    </select>
    <input id="filtro-busca" type="text" placeholder="Buscar por nome, rua ou bairro...">
  </div>

  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Endereço</th>
          <th>Bairro</th>
          <th>Solicitação</th>
          <th>Status</th>
          <th>Registrado por</th>
          <th>Data</th>
          <th class="no-print">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo">
        <tr><td colspan="8" class="vazio">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script>
  exigirLogin();
  document.getElementById('nome-usuario').textContent = getNomeSessao();

  document.getElementById('btn-sair').addEventListener('click', function() {
    limparSessao();
    window.location.href = 'index.html';
  });

  let TODAS_SOLICITACOES = [];
  let LISTA_FILTRADA = [];

  const ICONE_EDITAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>';
  const ICONE_EXCLUIR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>';
  const ICONE_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
  const ICONE_DESFAZER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>';

  function textoTipo(r) {
    return r.detalhe ? (r.tipo + ' — ' + r.detalhe) : r.tipo;
  }

  function hojeFormatado() {
    return new Date().toLocaleDateString('pt-BR');
  }

  function preencherFiltro(id, valores) {
    const select = document.getElementById(id);
    valores.forEach(function(v) {
      if (!v) return;
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  function valoresUnicos(lista, campo) {
    return Array.from(new Set(lista.map(function(r) { return r[campo]; }))).sort();
  }

  function renderTabela(lista) {
    const corpo = document.getElementById('tabela-corpo');
    corpo.innerHTML = '';

    if (lista.length === 0) {
      corpo.innerHTML = '<tr><td colspan="8" class="vazio">Nenhuma solicitação encontrada.</td></tr>';
      return;
    }

    lista.forEach(function(r) {
      const tr = document.createElement('tr');

      const statusBadge = r.atendida
        ? '<span class="badge-atendida">Atendida em ' + r.atendidaEm + '</span>'
        : '<span class="badge">Pendente</span>';

      const statusBotao = r.atendida
        ? '<button class="icon-btn no-print desfazer" data-id="' + r.id + '" aria-label="Marcar como pendente de novo">' + ICONE_DESFAZER + '</button>'
        : '<button class="icon-btn no-print marcar" data-id="' + r.id + '" aria-label="Marcar como atendida">' + ICONE_CHECK + '</button>';

      tr.innerHTML =
        '<td>' + r.nome + '</td>' +
        '<td>' + (r.endereco || '—') + '</td>' +
        '<td>' + r.bairro + '</td>' +
        '<td>' + textoTipo(r) + '</td>' +
        '<td class="status-cell">' + statusBadge + statusBotao + '</td>' +
        '<td><span class="badge">' + r.registradoPor + '</span></td>' +
        '<td>' + r.timestamp + '</td>' +
        '<td class="acoes-cell no-print">' +
          '<button class="icon-btn editar" data-id="' + r.id + '" aria-label="Editar solicitação de ' + r.nome + '">' + ICONE_EDITAR + '</button>' +
          '<button class="icon-btn excluir" data-id="' + r.id + '" aria-label="Excluir solicitação de ' + r.nome + '">' + ICONE_EXCLUIR + '</button>' +
        '</td>';
      corpo.appendChild(tr);
    });
  }

  function calcularEstatisticas(lista) {
    document.getElementById('stat-total').textContent = lista.length;

    const atendidas = lista.filter(function(r) { return r.atendida; }).length;
    document.getElementById('stat-atendidas').textContent = atendidas + ' de ' + lista.length;

    function itemMaisFrequente(campo) {
      const contagem = {};
      lista.forEach(function(r) {
        const v = r[campo];
        if (!v) return;
        contagem[v] = (contagem[v] || 0) + 1;
      });
      let melhor = '—', max = 0;
      Object.keys(contagem).forEach(function(k) {
        if (contagem[k] > max) { max = contagem[k]; melhor = k; }
      });
      return melhor;
    }

    document.getElementById('stat-bairro').textContent = itemMaisFrequente('bairro');
    document.getElementById('stat-tipo').textContent = itemMaisFrequente('tipo');
  }

  function aplicarFiltros() {
    const bairro = document.getElementById('filtro-bairro').value;
    const tipo = document.getElementById('filtro-tipo').value;
    const coletor = document.getElementById('filtro-coletor').value;
    const status = document.getElementById('filtro-status').value;
    const busca = document.getElementById('filtro-busca').value.trim().toLowerCase();

    LISTA_FILTRADA = TODAS_SOLICITACOES.filter(function(r) {
      if (bairro && r.bairro !== bairro) return false;
      if (tipo && r.tipo !== tipo) return false;
      if (coletor && r.registradoPor !== coletor) return false;
      if (status === 'pendente' && r.atendida) return false;
      if (status === 'atendida' && !r.atendida) return false;
      if (busca) {
        const alvo = (r.nome + ' ' + r.endereco + ' ' + r.bairro).toLowerCase();
        if (alvo.indexOf(busca) === -1) return false;
      }
      return true;
    });

    renderTabela(LISTA_FILTRADA);
    calcularEstatisticas(LISTA_FILTRADA);
  }

  ['filtro-bairro', 'filtro-tipo', 'filtro-coletor', 'filtro-status'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', aplicarFiltros);
  });
  document.getElementById('filtro-busca').addEventListener('input', aplicarFiltros);

  document.getElementById('tabela-corpo').addEventListener('click', function(e) {
    const btnEditar = e.target.closest('.icon-btn.editar');
    const btnExcluir = e.target.closest('.icon-btn.excluir');
    const btnMarcar = e.target.closest('.icon-btn.marcar');
    const btnDesfazer = e.target.closest('.icon-btn.desfazer');

    if (btnEditar) {
      const id = Number(btnEditar.dataset.id);
      const registro = TODAS_SOLICITACOES.find(function(r) { return r.id === id; });
      if (registro) {
        sessionStorage.setItem('cd_edicao', JSON.stringify(registro));
        window.location.href = 'coleta.html';
      }
      return;
    }

    if (btnExcluir) {
      const id = Number(btnExcluir.dataset.id);
      const registro = TODAS_SOLICITACOES.find(function(r) { return r.id === id; });
      if (!registro) return;

      const confirmar = window.confirm('Excluir a solicitação de ' + registro.nome + '? Essa ação não pode ser desfeita.');
      if (!confirmar) return;

      btnExcluir.disabled = true;
      apiExcluir(getPin(), id).then(function(resp) {
        if (resp.ok) {
          TODAS_SOLICITACOES = TODAS_SOLICITACOES.filter(function(r) { return r.id !== id; });
          aplicarFiltros();
        } else {
          alert(resp.erro || 'Não foi possível excluir.');
          btnExcluir.disabled = false;
        }
      }).catch(function() {
        alert('Não foi possível conectar. Verifique sua internet.');
        btnExcluir.disabled = false;
      });
      return;
    }

    if (btnMarcar || btnDesfazer) {
      const btn = btnMarcar || btnDesfazer;
      const novoStatus = !!btnMarcar; // true = marcando como atendida, false = desfazendo
      const id = Number(btn.dataset.id);

      btn.disabled = true;
      apiMarcarAtendida(getPin(), id, novoStatus).then(function(resp) {
        if (resp.ok) {
          const registro = TODAS_SOLICITACOES.find(function(r) { return r.id === id; });
          if (registro) {
            registro.atendida = novoStatus;
            registro.atendidaEm = novoStatus ? hojeFormatado() : null;
          }
          aplicarFiltros();
        } else {
          alert(resp.erro || 'Não foi possível atualizar o status.');
          btn.disabled = false;
        }
      }).catch(function() {
        alert('Não foi possível conectar. Verifique sua internet.');
        btn.disabled = false;
      });
    }
  });

  function exportarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    const dataAtual = new Date().toLocaleDateString('pt-BR');

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.setTextColor(26, 26, 26);
    doc.text('Painel de Solicitações', 14, 18);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(120, 120, 120);
    doc.text('Gerado em ' + dataAtual + ' · ' + LISTA_FILTRADA.length + ' solicitação(ões)', 14, 24);

    doc.autoTable({
      startY: 30,
      head: [['Nome', 'Telefone', 'Endereço', 'Bairro', 'Solicitação', 'Status']],
      body: LISTA_FILTRADA.map(function(r) {
        return [
          r.nome,
          r.telefone || '—',
          r.endereco || '—',
          r.bairro,
          textoTipo(r),
          r.atendida ? ('Atendida em ' + r.atendidaEm) : 'Pendente'
        ];
      }),
      styles: { fontSize: 9, cellPadding: 5, textColor: [26, 26, 26], overflow: 'linebreak' },
      headStyles: { fillColor: [122, 46, 46], textColor: [255, 255, 255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [247, 245, 240] },
      columnStyles: {
        0: { cellWidth: 34 }, // Nome
        1: { cellWidth: 34 }, // Telefone — mais largo para não quebrar linha
        2: { cellWidth: 38 }, // Endereço
        3: { cellWidth: 24 }, // Bairro
        4: { cellWidth: 'auto' }, // Solicitação — fica com o espaço que sobrar
        5: { cellWidth: 28 }  // Status
      }
    });

    doc.save('solicitacoes-' + dataAtual.replace(/\//g, '-') + '.pdf');
  }

  document.getElementById('btn-exportar').addEventListener('click', exportarPDF);

  apiListar(getPin()).then(function(resp) {
    if (!resp.ok) {
      document.getElementById('tabela-corpo').innerHTML =
        '<tr><td colspan="8" class="vazio">' + (resp.erro || 'Erro ao carregar dados.') + '</td></tr>';
      return;
    }
    TODAS_SOLICITACOES = resp.solicitacoes;
    preencherFiltro('filtro-bairro', valoresUnicos(TODAS_SOLICITACOES, 'bairro'));
    preencherFiltro('filtro-tipo', valoresUnicos(TODAS_SOLICITACOES, 'tipo'));
    preencherFiltro('filtro-coletor', valoresUnicos(TODAS_SOLICITACOES, 'registradoPor'));
    aplicarFiltros();
  }).catch(function() {
    document.getElementById('tabela-corpo').innerHTML =
      '<tr><td colspan="8" class="vazio">Não foi possível conectar. Verifique sua internet.</td></tr>';
  });
</script>
</body>
</html>
