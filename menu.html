<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coletor de Demandas — Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container-mobile" style="display:flex;flex-direction:column;justify-content:center;">

  <div style="text-align:center;margin-bottom:32px;">
    <div style="font-size:14px;color:var(--c-text-muted);">Olá,</div>
    <h1 id="nome-usuario" style="font-size:26px;font-weight:800;color:var(--c-accent);margin-top:4px;">—</h1>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <a class="btn" href="coleta.html">Nova Solicitação</a>
    <a class="btn btn-secondary" href="painel.html">Ver Painel</a>
  </div>

  <button class="btn-text" id="btn-sair" style="margin-top:28px;">Sair</button>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script>
  exigirLogin();
  document.getElementById('nome-usuario').textContent = getNomeSessao();

  document.getElementById('btn-sair').addEventListener('click', function() {
    limparSessao();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
