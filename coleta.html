<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Solicitação</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <a href="painel.html" aria-label="Voltar ao painel">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
  </a>
  <div>
    <div class="titulo" id="titulo-tela">Nova Solicitação</div>
    <div class="subtitulo">Coletado por: <span id="nome-coletor">—</span></div>
  </div>
</div>

<div class="container-mobile" style="padding-top:24px;">
  <form id="form-coleta" style="display:flex;flex-direction:column;gap:18px;">

    <div>
      <label for="nome">Nome completo</label>
      <input id="nome" class="field" type="text" placeholder="Ex.: Maria da Silva" required>
    </div>

    <div>
      <label for="endereco">Endereço (rua e número)</label>
      <input id="endereco" class="field" type="text" placeholder="Ex.: Rua das Flores, 123">
    </div>

    <div>
      <label for="bairro">Bairro</label>
      <input id="bairro" class="field" type="text" placeholder="Ex.: Centro" required>
    </div>

    <div>
      <label for="telefone">Telefone</label>
      <input id="telefone" class="field" type="tel" placeholder="(88) 9 9999-9999">
    </div>

    <div>
      <label for="tipo">Tipo de solicitação</label>
      <select id="tipo" class="field">
        <option value="">Selecione...</option>
        <option>Infraestrutura / Asfalto</option>
        <option>Iluminação pública</option>
        <option>Saneamento / Água e esgoto</option>
        <option>Saúde</option>
        <option>Educação</option>
        <option>Segurança</option>
        <option>Assistência social</option>
        <option>Outro</option>
      </select>
    </div>

    <div>
      <label for="detalhe">Detalhe do pedido</label>
      <textarea id="detalhe" class="field" rows="2" placeholder="Descreva o que foi solicitado"></textarea>
    </div>

    <div>
      <label for="observacoes">Observações</label>
      <textarea id="observacoes" class="field" rows="3" placeholder="Informações adicionais (opcional)"></textarea>
    </div>

    <button type="submit" class="btn" id="btn-salvar" style="margin-top:8px;">Salvar Solicitação</button>
    <div class="error-msg" id="msg-erro"></div>
    <div class="success-msg" id="msg-sucesso"></div>
    <a href="painel.html" class="btn btn-secondary" id="link-painel" style="display:none;">Voltar ao Painel</a>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script>
  exigirLogin();
  document.getElementById('nome-coletor').textContent = getNomeSessao();

  // Se veio do botão "Editar" no painel, o registro chega aqui via
  // sessionStorage. Consumimos ele uma vez (removemos logo em
  // seguida) para não ficar "preso" em modo edição se a pessoa
  // voltar depois para cadastrar uma solicitação nova de verdade.
  let edicaoId = null;
  const dadosEdicao = sessionStorage.getItem('cd_edicao');
  if (dadosEdicao) {
    const registro = JSON.parse(dadosEdicao);
    sessionStorage.removeItem('cd_edicao');
    edicaoId = registro.id;

    document.getElementById('titulo-tela').textContent = 'Editar Solicitação';
    document.getElementById('nome').value = registro.nome || '';
    document.getElementById('endereco').value = registro.endereco || '';
    document.getElementById('bairro').value = registro.bairro || '';
    document.getElementById('telefone').value = registro.telefone || '';
    document.getElementById('tipo').value = registro.tipo || '';
    document.getElementById('detalhe').value = registro.detalhe || '';
    document.getElementById('observacoes').value = registro.observacoes || '';
    document.getElementById('btn-salvar').textContent = 'Salvar Alterações';
  }

  document.getElementById('form-coleta').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-salvar');
    const msgErro = document.getElementById('msg-erro');
    const msgSucesso = document.getElementById('msg-sucesso');
    msgErro.textContent = '';
    msgSucesso.textContent = '';

    const dados = {
      pin: getPin(),
      nomeEleitor: document.getElementById('nome').value.trim(),
      endereco: document.getElementById('endereco').value.trim(),
      bairro: document.getElementById('bairro').value.trim(),
      telefone: document.getElementById('telefone').value.trim(),
      tipo: document.getElementById('tipo').value,
      detalhe: document.getElementById('detalhe').value.trim(),
      observacoes: document.getElementById('observacoes').value.trim()
    };

    if (!dados.nomeEleitor || !dados.bairro) {
      msgErro.textContent = 'Nome e bairro são obrigatórios.';
      return;
    }

    btn.disabled = true;
    btn.textContent = edicaoId ? 'Salvando alterações...' : 'Salvando...';

    const chamada = edicaoId
      ? apiEditar(Object.assign({ id: edicaoId }, dados))
      : apiSalvar(dados);

    chamada.then(function(resp) {
      btn.disabled = false;
      btn.textContent = edicaoId ? 'Salvar Alterações' : 'Salvar Solicitação';
      if (resp.ok) {
        msgSucesso.textContent = edicaoId
          ? 'Solicitação atualizada com sucesso!'
          : 'Solicitação registrada com sucesso!';
        if (!edicaoId) {
          document.getElementById('form-coleta').reset();
        }
        document.getElementById('link-painel').style.display = 'flex';
      } else {
        msgErro.textContent = resp.erro || 'Não foi possível salvar.';
      }
    }).catch(function() {
      btn.disabled = false;
      btn.textContent = edicaoId ? 'Salvar Alterações' : 'Salvar Solicitação';
      msgErro.textContent = 'Não foi possível conectar. Verifique sua internet.';
    });
  });
</script>
</body>
</html>
